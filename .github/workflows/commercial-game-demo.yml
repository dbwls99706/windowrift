name: commercial game proof
on:
  push:
    paths:
      - '.github/workflows/commercial-game-demo.yml'
      - 'scripts/ci/doom-chrome.sh'
      - 'examples/chrome_omnibox_demo.py'
      - 'src/windowrift/doom_wad.py'
      - 'src/windowrift/proof_capture.py'
      - 'src/windowrift/omnibox.py'
      - 'src/windowrift/windows.py'
      - 'tests/test_doom_wad.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  doom-shareware:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install source port and X11 tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends chocolate-doom xvfb openbox wmctrl python3-venv python3-tk libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0
          python3 -m venv .venv
          .venv/bin/python -m pip install -e '.[dev]'
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          command -v google-chrome
          command -v chocolate-doom
      - name: Fetch locally and authenticate original Doom 1.9 shareware data
        shell: bash
        run: |
          set -euo pipefail
          curl -fLSsS --retry 3 --max-time 90 -o "$RUNNER_TEMP/doom1.wad" \
            https://raw.githubusercontent.com/Daivuk/PureDOOM/master/doom1.wad
          echo "f0cefca49926d00903cf57551d901abe  $RUNNER_TEMP/doom1.wad" | md5sum --check --status
          echo "DOOM_WAD=$RUNNER_TEMP/doom1.wad" >> "$GITHUB_ENV"
      - name: Run real Doom and Chrome in Xvfb, capture native overlay
        shell: bash
        run: bash scripts/ci/doom-chrome.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: doom-shareware-chrome-x11
          path: |
            artifacts/doom-chrome.png
            artifacts/doom-chrome.gif
            artifacts/proof.json
            artifacts/game.log
            artifacts/portal.log
          if-no-files-found: warn
          retention-days: 7
