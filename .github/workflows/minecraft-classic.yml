name: Minecraft Classic visual proof
on:
  push:
    paths:
      - '.github/workflows/minecraft-classic.yml'
      - 'scripts/ci/minecraft-classic.sh'
      - 'scripts/ci/minecraft_check.py'
      - 'examples/cinematic_omnibox_demo.py'
      - 'src/windowrift/windows.py'
      - 'examples/chrome_omnibox_demo.py'
      - 'scripts/ci/browser_probe.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  minecraft-classic:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install headful X11 testing requirements
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb openbox wmctrl x11-utils python3-venv python3-tk libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0
          python3 -m venv .venv
          .venv/bin/python -m pip install -e '.[dev]'
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          command -v google-chrome
      - name: Attempt real Minecraft Classic + Chrome native portal
        shell: bash
        run: bash scripts/ci/minecraft-classic.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minecraft-classic-visual-proof
          path: artifacts/minecraft/
          if-no-files-found: warn
          retention-days: 7
