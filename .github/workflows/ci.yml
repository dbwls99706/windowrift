name: tests
on:
  push:
  workflow_dispatch:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]' pytest-asyncio
      - run: python -m compileall -q src examples
      - run: QT_QPA_PLATFORM=offscreen python -m pytest -q tests/test_qt_smoke.py
      - run: pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check browser-extension/content.js
      - run: node --check browser-extension/popup.js
      - run: node --test tests/js/*.test.cjs
