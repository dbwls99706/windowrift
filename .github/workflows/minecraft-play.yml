name: Minecraft playable cross-window demo
on:
  push:
    paths:
      - '.github/workflows/minecraft-play.yml'
      - 'examples/minecraft_play_demo.py'
      - 'examples/minecraft-rift.html'
      - 'examples/minecraft-rift.js'
      - 'scripts/ci/minecraft-play.sh'
      - 'scripts/ci/block_arena_check.py'
      - 'scripts/ci/minecraft_world_ready.py'
      - 'tests/test_minecraft_world_ready.py'
      - 'src/windowrift/controller.py'
      - 'src/windowrift/bridge.py'
      - 'src/windowrift/windows.py'
      - 'src/windowrift/segmentation.py'
      - 'tests/js/minecraft-rift.test.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-minecraft-play:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install X11 and playable controller dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb openbox wmctrl xdotool x11-utils python3-venv python3-tk libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0
          python3 -m venv .venv
          .venv/bin/python -m pip install -e '.[dev]'
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          command -v google-chrome
          command -v xdotool
      - name: Play with real Minecraft Classic, live keyboard input and mutable browser DOM
        shell: bash
        run: bash scripts/ci/minecraft-play.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minecraft-human-controlled-browser-game
          path: artifacts/minecraft-play/
          if-no-files-found: warn
          retention-days: 7
